<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home page</title>

    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- daisyui and tailwind CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Text font Linked -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font awesome CDN connected -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <Style>
        *{
            font-family: "Geist", sans-serif;
        }
    </Style>
</head>

<body class="min-h-screen bg-[#F8FAFC] pb-14">

    <!-- navigation bar -->
    <nav class=" bg-white ">
        <div class="flex justify-between max-w-7xl mx-auto p-5">
            <div class="flex justify-center items-center gap-3">
                <img class="h-9" src="./assets/github-logo.png" alt="">
                <h2 class="text-[#1F2937] font-semibold text-xl">GitHub Issues Tracker</h2>
            </div>

            <div class="flex justify-center items-center gap-3">
            <label  class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke-width="2.5"
                    fill="none"
                    stroke="currentColor"
                    >
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input id="searchInput" type="search" required placeholder="Search" />
              </label>

             <button class="btn btn-primary"> <i class="fa-regular fa-plus"></i>New Issue</button>
            </div>
        </div>
    </nav>

    <main>

        <!-- button secction  -->
        <Section class="max-w-6xl mx-auto bg-white mt-7 p-5 rounded-md shadow-sm" >
            <button id="allButton" class="btn-toggle btn px-10 btn-primary" data-type="all">All</button>
            <button id="openButton" class=" btn-toggle btn px-10" data-type="open">Open</button>
            <button id="closeButton" class=" btn-toggle btn px-10" data-type="close">Close</button>
        </Section>


        <!-- issues section -->
        <Section class="max-w-6xl mx-auto bg-white mt-7 p-5 rounded-t-md shadow-md flex justify-between">
            <div class="flex justify-center items-center gap-3">
                <div class="bg-slate-300 rounded-full ">
                    <img src="./assets/Aperture.png" alt="">
                </div>
                <div>
                    <h3  id="issueCount"class="font-semibold text-[#1F2937]">50 <span>Issues</span></h3>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                </div>
            </div>

            <div class="flex justify-center items-center gap-2">
                <i class="fa-solid fa-circle text-[#00A96E]"></i> <p>Open</p>

                <i class="fa-solid fa-circle text-[#A855F7]"></i> <p>Closed</p>
            </div>
        </Section>

        <!-- loading spinner -->
      <div id="loadingSpinner" class="h-[60vh] flex hidden justify-center items-center">
          <span class="loading loading-dots loading-xl"></span>
      </div>

        <!-- Card Section -->
         <section class=" bg-[#FBFBFB] max-w-6xl mx-auto  shadow-sm ">

            <div id="card-container" class="p-5 grid grid-cols-4 gap-4">

            </div>

         </section>


          <!-- Open the modal using ID.showModal() method -->
            <dialog id="issueModal" class="modal">
                <div class="modal-box">

                    <h3 id="modalTitle" class="font-bold text-lg"></h3>
                    <div class="flex my-2 gap-4">
                    <div class=""><p id="modalStatus" class="bg-[#00A96E] px-3  rounded-3xl"></p></div>
                    
                    <p id="modalAuthor" class="text-sm text-gray-400"></p>
                    <p id="modalDate" class="text-sm text-gray-400"></p>
                    </div>

                    <div class="bg-yellow-200 px-3 my-4 rounded-3xl w-max">
                    <p id="modalLabels" class=""> </p>
                    </div>

                    <p id="modalDescription" class="text-gray-500"></p>

                    <hr class="my-2 opacity-30">

                    <div class="flex justify-between items-center mt-4">
                    <p id="assignee"></p>
                    <p id="modalPriority" class="bg-red-500 text-white px-3 py-1 rounded-3xl"></p>
                    </div>
                    
                    <div class="modal-action">
                    <form method="dialog">
                        <button class="btn">Close</button>
                    </form>
                    </div>

            </div>
            </dialog>

            


    </main>
    

    <!-- connect Js file  -->
    <script src="./home.js"></script>
</body>
</html>
